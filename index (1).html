<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6d3df0"><link rel="icon" href="icon-192.png"><title>Daftar Do'kon</title>
<style>
:root{--bg:#ece8fb;--card:#fff;--tx:#1d1b2e;--mut:#7a7790;--pr:#6d3df0;--pr2:#9a78ff;--prd:#4a22b8;--g:#16a34a;--r:#dc2626;--ln:#e3dff3;--sh:rgba(70,40,150,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121f;--card:#221e35;--tx:#f1effa;--mut:#9b97b5;--ln:#322d4a;--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#15121f;--card:#221e35;--tx:#f1effa;--mut:#9b97b5;--ln:#322d4a;--sh:rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:0 14px 150px;perspective:900px}
.v{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(14px) rotateX(8deg)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 12px}
.top h2{margin:0;font-size:22px}.top small{color:var(--mut)}
.b3{border:0;border-radius:14px;padding:11px 16px;font-weight:700;font-size:14px;font-family:inherit;color:#fff;background:linear-gradient(180deg,var(--pr2),var(--pr));box-shadow:0 5px 0 var(--prd),0 10px 18px var(--sh);transition:transform .08s,box-shadow .08s}
.b3:active{transform:translateY(4px);box-shadow:0 1px 0 var(--prd),0 3px 8px var(--sh)}
.b3.w{width:100%;padding:14px;font-size:16px}.b3.g{background:linear-gradient(180deg,#34d27a,var(--g));box-shadow:0 5px 0 #0d7a36,0 10px 18px var(--sh)}
.b3.r{background:linear-gradient(180deg,#f06a6a,var(--r));box-shadow:0 5px 0 #8f1313,0 10px 18px var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pc{background:linear-gradient(145deg,var(--card),var(--bg));border-radius:20px;padding:14px;position:relative;transform-style:preserve-3d;box-shadow:0 2px 0 rgba(255,255,255,.6) inset,0 12px 24px var(--sh),0 3px 6px var(--sh);transition:transform .15s ease-out;touch-action:pan-y;animation:pop .4s backwards}
@keyframes pop{from{opacity:0;transform:scale(.8) translateZ(-60px)}}
.pc .ic{font-size:46px;text-align:center;transform:translateZ(46px);filter:drop-shadow(0 12px 8px rgba(0,0,0,.3));margin:6px 0 8px}
.pc b{display:block;transform:translateZ(22px);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pr{transform:translateZ(22px);color:var(--pr);font-weight:800;margin:2px 0}.pc small{color:var(--mut);transform:translateZ(14px);display:block}
.pc .ed{position:absolute;right:8px;top:8px;background:none;border:0;font-size:15px;opacity:.6;transform:translateZ(30px)}
.qt{display:flex;align-items:center;justify-content:space-between;margin-top:10px;transform:translateZ(30px)}
.qt button{width:34px;height:34px;border-radius:50%;border:0;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--pr2),var(--pr));box-shadow:0 3px 0 var(--prd)}
.qt button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--prd)}.qt span{font-weight:800}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 10px 24px var(--sh),0 2px 0 rgba(255,255,255,.5) inset;margin-bottom:14px}
.st{display:flex;gap:12px;margin-bottom:14px}.st .card{flex:1;margin:0;transform:rotateY(-6deg);transform-origin:left}.st .card+.card{transform:rotateY(6deg);transform-origin:right}
.st small{color:var(--mut);font-size:12px}.st b{display:block;font-size:20px;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--pr2),var(--prd));box-shadow:4px 0 0 rgba(0,0,0,.18),0 6px 10px var(--sh);min-height:4px;animation:gr .7s backwards;transform-origin:bottom}
@keyframes gr{from{transform:scaleY(0)}}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:14px}.row .m small{color:var(--mut)}.row .a{font-weight:800;font-size:14px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pr2),var(--prd));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 4px 0 var(--prd);flex:none}
.empty{padding:24px;text-align:center;color:var(--mut);font-size:14px}.h{font-weight:800;margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
nav div{display:flex;width:100%;max-width:500px;background:var(--card);border-radius:22px;box-shadow:0 10px 30px var(--sh),0 2px 0 rgba(255,255,255,.5) inset;pointer-events:auto}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font-size:11px;font-family:inherit}
nav button i{display:block;font-style:normal;font-size:22px;transition:transform .2s}nav button.on{color:var(--pr);font-weight:700}nav button.on i{transform:translateY(-4px) scale(1.2)}
#cb{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 14px;z-index:6;pointer-events:none}
#cb div{max-width:500px;width:100%;background:var(--prd);color:#fff;border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 26px var(--sh);pointer-events:auto;animation:in .3s}
#cb button{padding:10px 18px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:10px;font-family:inherit}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:in .25s;max-height:90vh;overflow:auto}.sh h3{margin:0 0 12px}
.emo{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.emo span{font-size:26px;padding:4px 6px;border-radius:12px;background:var(--card)}.emo span.on{outline:3px solid var(--pr)}
#tt{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;z-index:40;box-shadow:0 10px 24px var(--sh);animation:tt 2s forwards}
@keyframes tt{0%{opacity:0;transform:translate(-50%,-30px) scale(.6)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#sp{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,#4a22b8,#9a78ff);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s;perspective:600px}
.cube{width:90px;height:90px;position:relative;transform-style:preserve-3d;animation:sp 2.4s ease-in-out infinite;margin-bottom:40px}
.cube i{position:absolute;inset:0;border:3px solid #fff;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:38px;font-style:normal}
.cube i:nth-child(1){transform:translateZ(45px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(45px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(45px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(45px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(45px)}
@keyframes sp{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(340deg) rotateY(360deg)}}
#sp h1{margin:0;font-size:34px;animation:in 1s .3s both}#sp p{opacity:.85;animation:in 1s .6s both}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:11px;border-radius:12px;border:0;background:var(--bg);color:var(--mut);font-weight:700;font-family:inherit;font-size:14px}.tabs .on{background:var(--pr);color:#fff;box-shadow:0 4px 0 var(--prd)}
.sm{padding:10px 13px}.note{color:var(--mut);font-size:12px;margin:8px 2px 0;line-height:1.4}
</style></head><body>
<div id="sp"><div class="cube"><i>🛍️</i><i>📦</i><i>💰</i><i>🏷️</i><i>⭐</i><i>🛒</i></div><h1>Daftar Do'kon</h1><p>Sotuv va hisob bir joyda</p></div>
<div id="app"></div><div id="cb"></div><div id="nv"></div><div id="md"></div>
<script>
const $=s=>document.querySelector(s);
let DB=null,R=0,ses=null,tab='boss',V='shop',cart={},EM='📦',BOSS=null,P=[],WK=[],SL=[];
const LK='dkL';
function ld(){try{const o=JSON.parse(localStorage.getItem(LK)||'{}');BOSS=o.boss||null;P=o.p||[];WK=o.w||[];SL=o.s||[]}catch(e){}}
function sl(){try{localStorage.setItem(LK,JSON.stringify({boss:BOSS,p:P,w:WK,s:SL}))}catch(e){}}
async function hs(l,p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dk|'+l+'|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'dk|'+l+'|'+p)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+h}}
const fm=n=>Math.round(n).toLocaleString('ru-RU')+" so'm";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=t=>new Date(t).toDateString(),dd=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const sell=a=>({n:a.reduce((s,x)=>s+x.items.reduce((p,i)=>p+i.q,0),0),sum:a.reduce((s,x)=>s+x.total,0)});
const cartT=()=>{let n=0,s=0;P.forEach(p=>{const q=cart[p.id]||0;n+=q;s+=q*p.price});return[n,s]};
function toast(t,e){const o=document.createElement('div');o.id='tt';o.textContent=t;if(e)o.style.background='var(--r)';document.body.appendChild(o);setTimeout(()=>o.remove(),2000)}
async function T(f){try{await f();return 1}catch(e){toast("Saqlab bo'lmadi: ruxsat yo'q yoki xatolik",1);return 0}}
async function put(col,o){if(DB){await DB.collection(col).doc(String(o.id)).set(o)}else{const A=col=='products'?P:col=='workers'?WK:SL,i=A.findIndex(x=>x.id==o.id);i<0?A.push(o):A[i]=o;sl()}}
async function rm(col,id){if(DB){await DB.collection(col).doc(String(id)).delete()}else{if(col=='products')P=P.filter(x=>x.id!=id);else WK=WK.filter(x=>x.id!=id);sl()}}
async function init(){
 try{DB=(window.claude&&await claude.use('db'))||null}catch(e){DB=null}
 try{ses=JSON.parse(localStorage.getItem('dkS')||'null')}catch(e){}
 if(DB){const f={},up=k=>{f[k]=1;R=f.p&&f.w&&f.s&&f.b;render()},er=()=>{DB=null;ld();R=1;toast('Umumiy rejim ishlamadi, yakka rejim',1);render()};
  DB.collection('products').onSnapshot(s=>{P=s.docs.map(d=>d.data());up('p')},er);
  DB.collection('workers').onSnapshot(s=>{WK=s.docs.map(d=>d.data());up('w')},er);
  DB.collection('sales').onSnapshot(s=>{SL=s.docs.map(d=>d.data());up('s')},er);
  DB.doc('meta/boss').onSnapshot(s=>{BOSS=s.exists?s.data():null;up('b')},er)}
 else{ld();R=1}render(1)}
// KIRISH
async function reg(){const l=$('#l').value.trim().toLowerCase(),p=$('#p').value,n=$('#sn').value.trim();
 if(!/^[a-z0-9_.]{3,}$/.test(l)||p.length<4){toast('Login: kamida 3 ta harf/raqam. Parol: kamida 4 belgi',1);return}
 const o={login:l,ph:await hs(l,p),shop:n||"Mening do'konim"};
 if(await T(async()=>{if(DB)await DB.doc('meta/boss').set(o);else{BOSS=o;sl()}}))enter({role:'boss',login:l})}
async function lg(){const l=$('#l').value.trim().toLowerCase(),ph=await hs(l,$('#p').value);
 if(tab=='boss'){BOSS&&BOSS.login==l&&BOSS.ph==ph?enter({role:'boss',login:l}):toast('Login yoki parol xato',1)}
 else{const w=WK.find(x=>x.login==l&&x.ph==ph);w?enter({role:'worker',login:l,name:w.name}):toast('Login yoki parol xato',1)}}
function enter(s){ses=s;V='shop';cart={};try{localStorage.setItem('dkS',JSON.stringify(s))}catch(e){}render(1)}
function out(){ses=null;cart={};try{localStorage.removeItem('dkS')}catch(e){}render(1)}
function go(v){V=v;render(1)}
const tp=(t,s,x)=>`<div class="top"><div><h2>${t}</h2><small>${s}</small></div><div style="display:flex;gap:8px">${x||''}<button class="b3 sm r" onclick="out()">⎋</button></div></div>`;
function render(anim){
 const A=$('#app');
 if(!R){A.innerHTML='<div class="empty">Yuklanmoqda…</div>';return}
 if(ses&&((ses.role=='boss'&&(!BOSS||BOSS.login!=ses.login))||(ses.role=='worker'&&!WK.find(w=>w.login==ses.login))))ses=null;
 if(!ses){$('#nv').innerHTML='';$('#cb').innerHTML='';
  A.innerHTML=`<div class="v"><div class="top"><div><h2>Daftar Do'kon</h2><small>${DB?'Umumiy rejim: barcha qurilmalar':"Yakka rejim: ma'lumot shu telefonda"}</small></div></div><div class="card">
  <div class="tabs"><button class="${tab=='boss'?'on':''}" onclick="tab='boss';render(1)">👑 Boshliq</button><button class="${tab=='worker'?'on':''}" onclick="tab='worker';render(1)">🧑‍💼 Ishchi</button></div>
  ${tab=='boss'&&!BOSS?`<input id="sn" placeholder="Do'kon nomi"><input id="l" placeholder="Login (harf/raqam)" autocapitalize="none"><input id="p" type="password" placeholder="Parol"><button class="b3 w" onclick="reg()">Ro'yxatdan o'tish</button>`:
  `<input id="l" placeholder="Login" autocapitalize="none"><input id="p" type="password" placeholder="Parol"><button class="b3 w" onclick="lg()">Kirish</button>`}
  <p class="note">${tab=='worker'?'Login va parolni boshliq beradi.':BOSS?'Siz boshliq sifatida kiring.':"Birinchi marta: do'kon egasi ro'yxatdan o'tadi."}</p></div></div>`;return}
 const B=ses.role=='boss';if(!B&&V!='shop'&&V!='me')V='shop';let h='';
 const tdyS=SL.filter(s=>dk(s.d)==dk(Date.now()));
 if(V=='shop'){
  h=tp(B?'Mahsulotlar':'Sotuv',esc(B?BOSS.shop:ses.name),B?`<button class="b3 sm" onclick="pf()">+ Qo'shish</button>`:'')+
  `<div class="grid">${P.map((p,i)=>{const q=cart[p.id]||0;return`<div class="pc" style="animation-delay:${i*50}ms">${B?`<button class="ed" onclick="pf(${p.id})">✎</button>`:''}<div class="ic">${esc(p.e)}</div><b>${esc(p.name)}</b><div class="pr">${fm(p.price)}</div><small>Omborda: ${p.stock}</small><div class="qt"><button onclick="ct(${p.id},-1)">−</button><span>${q}</span><button onclick="ct(${p.id},1)">+</button></div></div>`}).join('')}</div>
  ${P.length?'':`<div class="card empty">${B?"Hali mahsulot yo'q. \"+ Qo'shish\" tugmasi bilan kiriting.":"Boshliq hali mahsulot qo'shmagan."}</div>`}`}
 else if(V=='stats'){
  const tdy=sell(tdyS),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:['Ya','Du','Se','Ch','Pa','Ju','Sh'][d.getDay()],v:sell(SL.filter(s=>dk(s.d)==d.toDateString())).sum}}),mx=Math.max(...days.map(x=>x.v),1);
  const pm={},wm={};tdyS.forEach(s=>{s.items.forEach(i=>pm[i.name]=(pm[i.name]||0)+i.q);wm[s.byName]=(wm[s.byName]||0)+s.total});
  h=tp('Bugungi sotuv',new Date().toLocaleDateString('ru-RU'))+`<div class="st"><div class="card"><small>Sotilgan</small><b>${tdy.n} dona</b></div><div class="card"><small>Tushum</small><b style="color:var(--g)">${fm(tdy.sum)}</b></div></div>
  <div class="card"><p class="h">Oxirgi 7 kun</p><div class="bars">${days.map((x,i)=>`<div><i style="height:${x.v/mx*100}%;animation-delay:${i*80}ms"></i>${x.l}</div>`).join('')}</div></div>
  <div class="card"><p class="h">Bugun nima sotildi</p>${Object.entries(pm).map(([k,v])=>`<div class="row"><div class="m"><b>${esc(k)}</b></div><div class="a">${v} dona</div></div>`).join('')||'<div class="empty">Bugun sotuv yo\'q</div>'}</div>
  <div class="card"><p class="h">Kim qancha sotdi (bugun)</p>${Object.entries(wm).map(([k,v])=>`<div class="row"><div class="m"><b>${esc(k)}</b></div><div class="a">${fm(v)}</div></div>`).join('')||'<div class="empty">—</div>'}</div>
  <div class="card"><p class="h">So'nggi sotuvlar</p>${[...SL].sort((a,b)=>b.d-a.d).slice(0,8).map(s=>`<div class="row"><div class="m"><b>${esc(s.client)}</b><small>${dd(s.d)} · ${esc(s.byName)}</small></div><div class="a" style="color:var(--g)">${fm(s.total)}</div></div>`).join('')||'<div class="empty">Sotuvlar yo\'q</div>'}</div>`}
 else if(V=='cl'){
  const m={};SL.forEach(s=>{const c=m[s.client]=m[s.client]||{n:0,sum:0};c.n++;c.sum+=s.total});const L=Object.entries(m).sort((a,b)=>b[1].sum-a[1].sum);
  h=tp('Mijozlar',L.length+' ta mijoz')+`<div class="card">${L.map(([k,c])=>`<div class="row"><div class="av">${esc(k[0].toUpperCase())}</div><div class="m"><b>${esc(k)}</b><small>${c.n} marta xarid</small></div><div class="a">${fm(c.sum)}</div></div>`).join('')||'<div class="empty">Mijozlar shu yerda paydo bo\'ladi</div>'}</div>`}
 else if(V=='wk'){
  h=tp('Ishchilar',WK.length+' ta ishchi',`<button class="b3 sm" onclick="wf()">+ Ishchi</button>`)+`<div class="card">${WK.map(w=>`<div class="row"><div class="av">${esc(w.name[0].toUpperCase())}</div><div class="m"><b>${esc(w.name)}</b><small>Login: ${esc(w.login)}</small></div><button class="b3 sm r" onclick="dw('${esc(w.login)}')">✕</button></div>`).join('')||'<div class="empty">Ishchi yo\'q. "+ Ishchi" bosib login va parol yarating.</div>'}</div>
  <p class="note">Ishchi o'z telefonida "🧑‍💼 Ishchi" bo'limini bosib, siz bergan login va parol bilan kiradi. U faqat sotish bo'limini ko'radi.</p>`}
 else{
  const me=sell(tdyS.filter(s=>s.by==ses.login));
  h=tp('Mening sotuvim',esc(ses.name))+`<div class="st"><div class="card"><small>Bugun sotdim</small><b>${me.n} dona</b></div><div class="card"><small>Tushum</small><b style="color:var(--g)">${fm(me.sum)}</b></div></div><div class="card"><p class="h">So'nggi sotuvlarim</p>${SL.filter(s=>s.by==ses.login).sort((a,b)=>b.d-a.d).slice(0,10).map(s=>`<div class="row"><div class="m"><b>${esc(s.client)}</b><small>${dd(s.d)}</small></div><div class="a">${fm(s.total)}</div></div>`).join('')||'<div class="empty">Hali sotuv yo\'q</div>'}</div>`}
 A.innerHTML=`<div class="${anim?'v':''}">${h}</div>`;
 const[n,s]=cartT();$('#cb').innerHTML=V=='shop'&&n?`<div><span>🛒 ${n} dona · <b>${fm(s)}</b></span><button class="b3 g" onclick="chk()">Sotish</button></div>`:'';
 const Tb=B?[['shop','🛍️',"Do'kon"],['stats','📊','Hisobot'],['cl','👥','Mijozlar'],['wk','🧑‍💼','Ishchilar']]:[['shop','🛍️','Sotuv'],['me','📈','Mening']];
 $('#nv').innerHTML='<nav><div>'+Tb.map(t=>`<button class="${V==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('')+'</div></nav>'}
function ct(id,d){const p=P.find(x=>x.id==id),q=(cart[id]||0)+d;if(q<0)return;if(q>p.stock){toast('Omborda yetarli emas',1);return}cart[id]=q;if(!q)delete cart[id];render()}
function sheet(h){$('#md').innerHTML='<div class="ov" onclick="if(event.target==this)cl()"><div class="sh">'+h+'</div></div>'}
function cl(){$('#md').innerHTML=''}
const EL=['📦','👕','👟','🍎','🥤','🍞','📱','🎧','🧴','📚','🧸','🔧'];
function pf(id){if(ses.role!='boss')return;const p=P.find(x=>x.id==id)||{};EM=p.e||'📦';
 sheet(`<h3>${id?'Mahsulotni tahrirlash':'Yangi mahsulot'}</h3><div class="emo">${EL.map(e=>`<span class="${e==EM?'on':''}" onclick="EM='${e}';document.querySelectorAll('.emo span').forEach(s=>s.classList.toggle('on',s.textContent=='${e}'))">${e}</span>`).join('')}</div>
 <input id="f1" placeholder="Mahsulot nomi" value="${esc(p.name||'')}"><input id="f2" type="number" inputmode="numeric" placeholder="Narxi (so'm)" value="${p.price||''}"><input id="f3" type="number" inputmode="numeric" placeholder="Omborda necha dona" value="${p.stock??''}">
 <button class="b3 w" onclick="sp(${id||0})">Saqlash</button>${id?`<button class="b3 w r" style="margin-top:14px" onclick="dp(${id})">O'chirish</button>`:''}`)}
async function sp(id){const n=$('#f1').value.trim(),pr=+$('#f2').value,st=+$('#f3').value||0;if(!n||!(pr>0)){toast('Nom va narxni kiriting',1);return}
 if(await T(()=>put('products',{id:id||Date.now(),name:n,price:pr,stock:st,e:EM}))){cl();render()}}
async function dp(id){if(await T(()=>rm('products',id))){delete cart[id];cl();render()}}
function wf(){sheet(`<h3>Yangi ishchi</h3><input id="w1" placeholder="Ishchi ismi"><input id="w2" placeholder="Login (harf/raqam)" autocapitalize="none"><input id="w3" placeholder="Parol (kamida 4 belgi)"><button class="b3 w" onclick="sw()">Saqlash</button><p class="note">Shu login va parolni ishchiga bering.</p>`)}
async function sw(){const n=$('#w1').value.trim(),l=$('#w2').value.trim().toLowerCase(),p=$('#w3').value;
 if(!n||!/^[a-z0-9_.]{3,}$/.test(l)||p.length<4){toast("Ism, login (3+ harf/raqam) va parol (4+) kerak",1);return}
 if(WK.find(w=>w.login==l)||BOSS.login==l){toast('Bu login band',1);return}
 const ph=await hs(l,p);if(await T(()=>put('workers',{id:l,login:l,name:n,ph}))){cl();render();toast('✅ Ishchi qo\'shildi')}}
async function dw(l){if(await T(()=>rm('workers',l)))render()}
function chk(){const names=[...new Set(SL.map(s=>s.client))],its=P.filter(p=>cart[p.id]),[n,s]=cartT();
 sheet(`<h3>Sotuvni tasdiqlash</h3><div class="card">${its.map(p=>`<div class="row"><div class="m"><b>${esc(p.e)} ${esc(p.name)}</b><small>${cart[p.id]} × ${fm(p.price)}</small></div><div class="a">${fm(cart[p.id]*p.price)}</div></div>`).join('')}<div class="row"><div class="m"><b>Jami</b></div><div class="a">${fm(s)}</div></div></div>
 <input id="cn" list="dl" placeholder="Mijoz ismi (ixtiyoriy)"><datalist id="dl">${names.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><button class="b3 w g" onclick="done()">✓ Sotildi</button>`)}
async function done(){const items=[],up=[];let total=0;P.forEach(p=>{const q=cart[p.id];if(q){items.push({name:p.name,price:p.price,q});total+=q*p.price;up.push({...p,stock:p.stock-q})}});
 const c=$('#cn').value.trim()||'Oddiy mijoz';
 if(await T(async()=>{await put('sales',{id:String(Date.now()),d:Date.now(),client:c,items,total,by:ses.login,byName:ses.role=='boss'?'Boshliq':ses.name});for(const p of up){if(p.stock<=0)await rm('products',p.id);else await put('products',p)}})){const fin=up.filter(p=>p.stock<=0).map(p=>p.name);cart={};cl();render();toast('✅ Sotildi: '+fm(total)+(fin.length?' · Tugadi: '+fin.join(', '):''))}}
let TL=null;const A=$('#app');
A.addEventListener('pointermove',e=>{const c=e.target.closest('.pc');if(TL&&TL!=c)TL.style.transform='';if(!c)return;TL=c;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*28}deg) rotateX(${-y*28}deg) scale(1.04)`});
['pointerup','pointercancel','pointerleave'].forEach(k=>A.addEventListener(k,()=>{if(TL){TL.style.transform='';TL=null}}));
init();
setTimeout(()=>{const s=$('#sp');s.style.opacity=0;setTimeout(()=>s.remove(),500)},2400);
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script></body></html>
